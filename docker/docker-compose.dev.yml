version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: custos-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: custos_db
      POSTGRES_USER: custos_user
      POSTGRES_PASSWORD: custos_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U custos_user -d custos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: custos-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  sftp-mock:
    image: atmoz/sftp:latest
    container_name: custos-sftp-dev
    restart: unless-stopped
    ports:
      - "2222:22"
    command: sftpuser:sftppassword:::upload

volumes:
  postgres_data:
  redis_data:
